<style>
  :root{
    --bg-deep:#080b14;
    --bg-mid:#131a2e;
    --bg-glow:#1c2748;
    --accent:#ff741f;
    --accent-light:#ffa35c;
    --accent-deep:#c2470d;
    --text-primary:#f4f2ec;
    --text-muted:#8b90a8;
    --line:rgba(255,255,255,0.14);
    --glass-fill:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.09);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(900px 560px at 50% 26%, var(--bg-glow) 0%, transparent 60%),
      radial-gradient(1200px 800px at 50% 100%, var(--bg-mid) 0%, transparent 55%),
      var(--bg-deep);
    background-color:var(--bg-deep);
    font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--text-primary);
    padding:32px 20px;
    overflow-x:hidden;
  }

  .scene{
    position:relative;
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .card{
    position:relative;
    width:100%;
    margin-top:92px;
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 30px 70px -24px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.07);
    padding:80px 30px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .logo-wrap{
    position:absolute;
    top:-92px;
    left:50%;
    transform:translateX(-50%);
    width:132px;
    height:132px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logo-glow{
    position:absolute;
    inset:-38px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,116,31,0.45) 0%, rgba(255,116,31,0.12) 45%, rgba(255,116,31,0) 72%);
    filter:blur(4px);
    animation:glowPulse 2.9s ease-in-out infinite;
  }

  .logo-img{
    position:relative;
    width:92px;
    height:92px;
    object-fit:contain;
    filter:drop-shadow(0 10px 22px rgba(255,116,31,0.4));
    animation:heartbeat 2.9s ease-in-out infinite;
  }

  .logo-wrap.active .logo-img,
  .logo-wrap.active .logo-glow{
    animation-duration:1.05s;
  }

  @keyframes heartbeat{
    0%, 100%{ transform:scale(1); }
    12%{ transform:scale(1.11); }
    24%{ transform:scale(1); }
    36%{ transform:scale(1.07); }
    60%{ transform:scale(1); }
  }

  @keyframes glowPulse{
    0%, 100%{ opacity:0.55; transform:scale(1); }
    12%{ opacity:1; transform:scale(1.16); }
    24%{ opacity:0.55; transform:scale(1); }
    36%{ opacity:0.85; transform:scale(1.08); }
    60%{ opacity:0.55; transform:scale(1); }
  }

  h1{
    font-family:'Syne', sans-serif;
    font-weight:700;
    font-size:clamp(22px, 5.6vw, 28px);
    letter-spacing:-0.01em;
    margin:0 0 8px;
    color:var(--text-primary);
  }

  .subtext{
    font-size:14px;
    color:var(--text-muted);
    margin:0 0 38px;
  }

  form{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .field{
    text-align:left;
  }

  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:9px;
  }

  .field input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--line);
    color:var(--text-primary);
    font-family:'DM Sans', sans-serif;
    font-size:16px;
    padding:6px 2px 11px;
    outline:none;
    transition:border-color .25s ease, box-shadow .25s ease;
  }

  .field input::placeholder{
    color:rgba(255,255,255,0.3);
  }

  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 1.5px 0 0 var(--accent);
  }

  button.submit{
    position:relative;
    margin-top:16px;
    width:100%;
    border:none;
    cursor:pointer;
    padding:16px 20px;
    border-radius:999px;
    background:linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 55%, var(--accent-deep) 100%);
    color:#211004;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:15.5px;
    letter-spacing:.01em;
    box-shadow:0 14px 30px -8px rgba(255,116,31,0.55), 0 2px 6px rgba(0,0,0,.35);
    transition:transform .18s ease, box-shadow .18s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
  }

  button.submit:hover{
    box-shadow:0 16px 34px -6px rgba(255,116,31,0.6), 0 2px 6px rgba(0,0,0,.35);
  }

  button.submit:active{
    transform:scale(0.97);
  }

  button.submit:focus-visible{
    outline:2px solid var(--accent-light);
    outline-offset:3px;
  }

  .spinner{
    width:17px;
    height:17px;
    border-radius:50%;
    border:2.5px solid rgba(33,16,4,0.32);
    border-top-color:#211004;
    display:none;
    animation:spin .7s linear infinite;
  }

  button.submit.loading .btn-text{ display:none; }
  button.submit.loading .spinner{ display:inline-block; }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .field input:focus-visible{
    outline:none;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-img, .logo-glow{ animation:none; }
    .logo-wrap.active .logo-img{ filter:drop-shadow(0 10px 26px rgba(255,116,31,0.6)); }
  }

  @media (max-width:360px){
    .card{ padding:76px 22px 34px; }
  }
</style>
</head>

      <h1>Welcome back</h1>
      <p class="subtext">Sign in to continue</p>

      <form id="loginForm">
        <div class="field">
          <label for="username">Email or username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit" id="submitBtn">
          <span class="btn-text">Log in</span>
          <span class="spinner"></span>
        </button>
      </form>
    </div>
  </div>

<script>
  const logoWrap = document.getElementById('logoWrap');
  const fields = document.querySelectorAll('.field input');

  fields.forEach(function(el){
    el.addEventListener('focus', function(){ logoWrap.classList.add('active'); });
    el.addEventListener('blur', function(){ logoWrap.classList.remove('active'); });
  });

  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (submitBtn.classList.contains('loading')) return;
    submitBtn.classList.add('loading');
    setTimeout(function(){
      submitBtn.classList.remove('loading');
    }, 1300);
  });
</script>
